# Netlify build configuration.
#
# The Next.js runtime is what makes this app work on Netlify at all: the site
# is not a static export. `/api/lead` is a Route Handler, `/industries/[slug]`
# is SSG with `dynamicParams = false`, and next/image needs an optimizer. The
# runtime maps all three onto Netlify Functions and the Image CDN. Publishing
# `.next` without it would serve the build manifest as if it were a website.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Match the engines field in package.json. Netlify's default is older, and
  # Next 15 fails on it.
  NODE_VERSION = "22"
  # Lint and typecheck run as their own gate before deploy, not inside the
  # build. Keeps a deploy from silently succeeding with a lint regression.
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-lived caching for the immutable brand assets. They are content-addressed
# by name and only change when the artwork itself is replaced.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
